# Dependabot: abre PRs mensais com atualizações de dependências (agrupadas para não lotar de PR).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
